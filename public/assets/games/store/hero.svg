<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <!-- Deep PlayStation Cobalt Radial Background -->
    <radialGradient id="storeBg" cx="70%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#00388d" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#002159" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#001030" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#020408" stop-opacity="1" />
    </radialGradient>

    <!-- Sapphire Wave Gradient 1 -->
    <linearGradient id="auroraBlue1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070d1" stop-opacity="0" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="85%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>

    <!-- Electric Cyan Wave Gradient 2 -->
    <linearGradient id="auroraCyan2" x1="10%" y1="90%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="90%" stop-color="#7dd3fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Deep Void Base -->
  <rect width="3840" height="2160" fill="#020306" />
  <rect width="3840" height="2160" fill="url(#storeBg)" />

  <!-- Luminous Atmospheric Blue Glows -->
  <ellipse cx="2700" cy="950" rx="1300" ry="800" fill="#0070d1" opacity="0.22" filter="url(#intenseGlow)" />
  <ellipse cx="2400" cy="1100" rx="900" ry="500" fill="#38bdf8" opacity="0.2" filter="url(#intenseGlow)" />

  <!-- Dynamic PS Store Aurora Energy Beams -->
  <path d="M 500,2160 C 1200,1650 1750,1320 2380,1020 C 2980,720 3450,520 3840,380 L 3840,740 C 3350,900 2820,1150 2180,1480 C 1550,1800 1050,2050 500,2160 Z" fill="url(#auroraBlue1)" filter="url(#softBlur)" />
  
  <path d="M 750,2160 C 1450,1580 2000,1200 2620,900 C 3150,650 3580,480 3840,420 L 3840,600 C 3450,700 2950,900 2400,1180 C 1800,1500 1250,1850 750,2160 Z" fill="url(#auroraCyan2)" filter="url(#softBlur)" />

  <!-- Core Pure White Shimmer Ray -->
  <path d="M 1100,2160 C 1720,1600 2200,1260 2720,980 C 3180,740 3580,580 3840,510" fill="none" stroke="#f0f9ff" stroke-width="5" opacity="0.75" filter="url(#softBlur)" />
  <path d="M 1100,2160 C 1720,1600 2200,1260 2720,980 C 3180,740 3580,580 3840,510" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" />

  <!-- Floating Sacred PlayStation Symbols (Store Edition) -->
  <g fill="#ffffff" opacity="0.28">
    <!-- Triangle △ -->
    <path d="M 2400,640 L 2435,705 L 2365,705 Z" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.5" />
    <!-- Circle ○ -->
    <circle cx="2860" cy="500" r="32" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.45" />
    <!-- Cross ✕ -->
    <g transform="translate(3320, 440) scale(1.8)" stroke="#60a5fa" stroke-width="2.5" opacity="0.5">
      <line x1="-12" y1="-12" x2="12" y2="12" />
      <line x1="12" y1="-12" x2="-12" y2="12" />
    </g>
    <!-- Square □ -->
    <rect x="2080" y="810" width="52" height="52" rx="4" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.4" />
  </g>

  <!-- Azure Stars & Light Particles -->
  <g fill="#fff" opacity="0.65">
    <circle cx="1920" cy="680" r="2" />
    <circle cx="2200" cy="540" r="3" opacity="0.85" />
    <circle cx="2550" cy="800" r="2.5" />
    <circle cx="2720" cy="380" r="1.5" />
    <circle cx="3000" cy="620" r="2.5" opacity="0.9" />
    <circle cx="3250" cy="340" r="2" />
    <circle cx="3500" cy="550" r="3" opacity="0.85" />
    <circle cx="3700" cy="420" r="2" />
  </g>
</svg>
