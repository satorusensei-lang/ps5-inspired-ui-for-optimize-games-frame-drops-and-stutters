<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="580" height="120" fill="none">
  <defs>
    <filter id="storeLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Store Bag Emblem -->
  <g transform="translate(50, 60)" filter="url(#storeLogoGlow)">
    <!-- Bag Body -->
    <path d="M -24,-6 L 24,-6 L 20,30 L -20,30 Z" fill="#0070d1" stroke="#ffffff" stroke-width="2.5" />
    <!-- Bag Handles -->
    <path d="M -13,-6 C -13,-22 13,-22 13,-6" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- 4 Mini Symbols inside bag -->
    <polygon points="0,4 3.5,10 -3.5,10" fill="#ffffff" />
    <circle cx="8" cy="18" r="2.8" stroke="#ffffff" stroke-width="1.2" fill="none" />
    <line x1="-10" y1="15" x2="-6" y2="21" stroke="#ffffff" stroke-width="1.2" />
    <line x1="-6" y1="15" x2="-10" y2="21" stroke="#ffffff" stroke-width="1.2" />
    <rect x="-2" y="17" width="4.5" height="4.5" stroke="#ffffff" stroke-width="1.2" fill="none" />
  </g>

  <!-- PlayStation Store Clean Typography -->
  <text x="110" y="68" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="0.01em">
    PlayStation Store
  </text>
  <text x="112" y="94" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="0.12em">
    OFFICIAL DIGITAL STORE
  </text>
</svg>
