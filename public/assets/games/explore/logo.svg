<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Compass Star Emblem -->
  <g transform="translate(48, 60)" filter="url(#logoGlow)">
    <circle cx="0" cy="0" r="32" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="24" stroke="#fbbf24" stroke-width="1.8" opacity="0.8" />
    <!-- 4-point Diamond Star -->
    <path d="M 0,-26 L 6,-6 L 26,0 L 6,6 L 0,26 L -6,6 L -26,0 L -6,-6 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="4" fill="#f59e0b" />
  </g>

  <!-- Clean PlayStation Standard Typography -->
  <text x="108" y="72" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="0.02em">
    Explore
  </text>
  <text x="305" y="71" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="22" font-weight="700" fill="#fbbf24" letter-spacing="0.1em">
    NEWS
  </text>
</svg>
