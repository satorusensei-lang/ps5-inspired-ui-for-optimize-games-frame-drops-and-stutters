<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <!-- Dark Cosmic Background -->
    <radialGradient id="bgGlow" cx="65%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#241a0d" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#14111d" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#08070d" stop-opacity="1" />
      <stop offset="100%" stop-color="#030305" stop-opacity="1" />
    </radialGradient>

    <!-- Golden Aurora Gradient 1 -->
    <linearGradient id="auroraGold1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.75" />
      <stop offset="85%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </linearGradient>

    <!-- Golden Aurora Gradient 2 -->
    <linearGradient id="auroraGold2" x1="10%" y1="90%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="90%" stop-color="#fcd34d" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </linearGradient>

    <!-- Amber Glow Ribbon -->
    <linearGradient id="ribbonAmber" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
  </defs>

  <!-- Deep Void Base -->
  <rect width="3840" height="2160" fill="#040406" />
  <rect width="3840" height="2160" fill="url(#bgGlow)" />

  <!-- Luminous Atmospheric Glow -->
  <ellipse cx="2600" cy="980" rx="1400" ry="750" fill="#f59e0b" opacity="0.12" filter="url(#intenseGlow)" />
  <ellipse cx="2300" cy="1150" rx="900" ry="500" fill="#fbbf24" opacity="0.18" filter="url(#intenseGlow)" />

  <!-- Flowing PS5 Cosmos Waves & Ribbons -->
  <path d="M 600,2160 C 1300,1650 1800,1350 2400,1050 C 3000,750 3450,550 3840,420 L 3840,780 C 3350,920 2850,1180 2200,1500 C 1600,1800 1100,2050 600,2160 Z" fill="url(#auroraGold1)" filter="url(#softBlur)" />
  
  <path d="M 800,2160 C 1500,1580 2050,1220 2650,920 C 3150,680 3550,520 3840,460 L 3840,640 C 3480,720 3000,920 2450,1200 C 1850,1520 1300,1880 800,2160 Z" fill="url(#auroraGold2)" filter="url(#softBlur)" />

  <path d="M 400,2160 C 1100,1750 1650,1480 2300,1250 C 2950,1020 3480,820 3840,680 L 3840,880 C 3380,1040 2820,1260 2150,1520 C 1450,1800 950,2020 400,2160 Z" fill="url(#ribbonAmber)" filter="url(#softBlur)" opacity="0.8" />

  <!-- Sharp Shimmer Core Wave -->
  <path d="M 1200,2160 C 1800,1620 2250,1300 2750,1020 C 3200,780 3580,620 3840,550" fill="none" stroke="#fffbeb" stroke-width="6" opacity="0.8" filter="url(#softBlur)" />
  <path d="M 1200,2160 C 1800,1620 2250,1300 2750,1020 C 3200,780 3580,620 3840,550" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9" />

  <!-- Stardust Clusters & Floating Sacred PlayStation Symbols -->
  <g fill="#ffffff" opacity="0.25">
    <!-- Triangle △ -->
    <path d="M 2350,680 L 2380,735 L 2320,735 Z" stroke="#fbbf24" stroke-width="2.5" fill="none" opacity="0.45" />
    <!-- Circle ○ -->
    <circle cx="2820" cy="540" r="28" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.4" />
    <!-- Cross ✕ -->
    <g transform="translate(3250, 480) scale(1.6)" stroke="#fcd34d" stroke-width="2.5" opacity="0.45">
      <line x1="-12" y1="-12" x2="12" y2="12" />
      <line x1="12" y1="-12" x2="-12" y2="12" />
    </g>
    <!-- Square □ -->
    <rect x="2040" y="850" width="46" height="46" rx="4" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.35" />
  </g>

  <!-- Ambient Micro Stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="1850" cy="720" r="2" />
    <circle cx="2150" cy="580" r="3" opacity="0.8" />
    <circle cx="2480" cy="850" r="2.5" />
    <circle cx="2680" cy="420" r="1.5" />
    <circle cx="2950" cy="680" r="2.5" opacity="0.9" />
    <circle cx="3180" cy="380" r="2" />
    <circle cx="3420" cy="590" r="3" opacity="0.8" />
    <circle cx="3650" cy="460" r="2" />
    <circle cx="1620" cy="980" r="2" />
    <circle cx="1920" cy="1120" r="2.5" />
    <circle cx="2250" cy="1020" r="3" />
    <circle cx="2580" cy="1180" r="2" />
  </g>
</svg>
