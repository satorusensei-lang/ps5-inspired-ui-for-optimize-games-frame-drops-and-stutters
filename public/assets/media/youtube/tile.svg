<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ff0000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#14141c"/>

  <g filter="url(#tileShadow)" transform="translate(76, 126)">
    <!-- Red rounded badge -->
    <rect width="360" height="260" rx="60" fill="#ff0000"/>
    <!-- White triangle -->
    <polygon points="150,85 245,130 150,175" fill="#ffffff"/>
  </g>
</svg>
