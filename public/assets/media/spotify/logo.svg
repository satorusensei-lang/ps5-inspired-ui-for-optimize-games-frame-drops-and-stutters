      <path d="M233 115 c-44 -26 -117 -28 -159 -16 -7 2 -14 -2 -16 -9 -2 -7 2 -14 9 -16 48 -15 129 -12 180 18 6 4 8 12 5 18 -4 6 -12 8 -19 5 z" fill="#121212"/>
      <path d="M214 163 c-36 -22 -92 -28 -135 -15 -6 2 -12 -2 -14 -7 -2 -6 2 -12 7 -14 49 -15 110 -8 152 17 5 3 7 10 4 15 -3 6 -10 7 -14 4 z" fill="#121212"/>
      <path d="M195 210 c-30 -18 -68 -23 -112 -13 -5 1 -10 -2 -11 -7 -1 -5 2 -10 7 -11 49 -11 91 -6 125 15 5 3 6 9 3 14 -3 5 -9 6 -12 2 z" fill="#121212"/>
    </g>

    <!-- White Spotify Wordmark -->
    <text x="110" y="74"
          font-family="'Circular', 'Montserrat', 'Segoe UI', -apple-system, sans-serif"
          font-size="48"
          font-weight="800"
          letter-spacing="-1px"
